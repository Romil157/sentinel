[project]
name = "sentinel"
version = "1.0.0"
description = "Sentinel - AI-Powered Scam, Phishing, and Cyber Threat Detection Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "Flask-RESTful>=0.3.10",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.0.7",
    "Flask-Cors>=4.0.0",
    "Flask-JWT-Extended>=4.6.0",
    "Flask-Limiter>=3.8.0",
    "Flask-Bcrypt>=1.0.1",
    "SQLAlchemy>=2.0.30",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
    "marshmallow>=3.21.1",
    "requests>=2.31.0",
    "gunicorn>=22.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests"
]
pythonpath = [
    ".",
    "backend"
]

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "migrations"
]
