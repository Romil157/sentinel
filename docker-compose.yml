version: '3.8'

services:
  api:
    build: .
    container_name: sentinel-api
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=change-this-in-production-secret-key-123
      - JWT_SECRET_KEY=change-this-jwt-secret-key-456
      - DATABASE_URL=sqlite:///sentinel.db
      - FLASK_ENV=prod
    volumes:
      - sentinel-data:/app/backend

  frontend:
    image: nginx:alpine
    container_name: sentinel-ui
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  sentinel-data:
